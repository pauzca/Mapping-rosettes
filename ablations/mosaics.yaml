# Evaluation mosaics, grouped like the paper's results table (Resolución / Mosaicos).
# Paths are relative to the repository root; a mosaic is skipped while its raster is missing.
# All mosaics are tiled at the training ground resolution (gsd, m/px) with 512 px tiles and 20% overlap.
dic3cm:
  name: Diciembre GSD 3.6 cm
  resolution: Baja
  raster: data/mosaics/rosettes_gsd_3cm_mosaic.tif
  gt: mosaics_val/rosettes_gsd_3cm/rosettes_gsd_3cm_boxes.gpkg
  gsd: 0.0136
dic1cm:
  name: Diciembre
  resolution: Alta
  raster: data/mosaics/rosettes_gsd_1cm_mosaic.tif
  gt: mosaics_val/rosettes_gsd_1cm/rosettes_gsd_1cm_boxes.gpkg
  layer: rosettes_gsd_1cm_boxes
  gsd: 0.0136
# agosto / junio2025: add raster + ground truth when available
